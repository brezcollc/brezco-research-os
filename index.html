<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brezco Research OS</title>
  <meta name="description" content="Brezco Capital — private equity research dashboard." />
  <!-- The live app now lives at /beta/ (Supabase-backed, cloud-synced, full
       dataset). This old root page is kept only as a redirect so any old
       bookmark or link lands on the one true app. -->
  <meta http-equiv="refresh" content="0; url=./beta/" />
  <link rel="canonical" href="https://brezcollc.github.io/brezco-research-os/beta/" />
  <script>location.replace('./beta/' + location.hash);</script>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #060d1a; color: #f2f0e9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 420px; }
    .mark { font-size: 34px; color: #c9a961; margin-bottom: 14px; }
    h1 { font-size: 18px; letter-spacing: 0.02em; margin: 0 0 10px; }
    p { color: #b8c0cc; line-height: 1.6; font-size: 14px; margin: 0 0 18px; }
    a.btn {
      display: inline-block; text-decoration: none;
      background: linear-gradient(180deg, #e8c778, #c9a961); color: #060d1a;
      font-weight: 700; padding: 10px 20px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">▚</div>
    <h1>Brezco Research OS has moved</h1>
    <p>The live app is now at <strong>/beta/</strong> — cloud-synced with your full research library. Redirecting you now…</p>
    <a class="btn" href="./beta/">Open Brezco Research OS →</a>
  </div>
</body>
</html>
